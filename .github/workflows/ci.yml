name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate package metadata
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version||!p.bin) process.exit(1); console.log('package.json OK')"

      - name: Validate JSON metadata
        run: node -e "for (const f of ['mcp.json','cursor-directory.json','.cursor-plugin/plugin.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log(f+' OK') }"

      - name: Validate skill frontmatter
        run: node -e "const fs=require('fs'); const p='.cursor-plugin/skills/learnonetech-research/SKILL.md'; const s=fs.readFileSync(p,'utf8'); if(!s.startsWith('---\\n')||!s.includes('\\nname: learnonetech-research\\n')||!s.includes('\\ndescription:')) process.exit(1); if(!s.includes('\\n---\\n')) process.exit(1); console.log('SKILL.md frontmatter OK')"

      - name: Check server syntax
        run: node --check server.mjs

      - name: Check LearnOneTech API
        run: node -e "fetch('https://learnonetech.com/wp-json/wp/v2/posts?per_page=1').then(async r=>{console.log('HTTP '+r.status); if(!r.ok) process.exit(1); await r.text()}).catch(e=>{console.error(e); process.exit(1)})"

      - name: Verify MCP starts
        run: timeout 8s npm start || test $? -eq 124
